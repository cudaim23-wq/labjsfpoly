<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 7 - Máy tính chi tiêu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 760px;
            margin: 30px auto;
            padding: 0 16px;
            color: #222;
        }
        .the-thong-ke {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin: 20px 0;
        }
        .the {
            background: #f1f5ff;
            border-radius: 8px;
            padding: 14px;
        }
        .the .nhan {
            font-size: 13px;
            color: #555;
        }
        .the .so {
            font-size: 18px;
            font-weight: bold;
            margin-top: 6px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 8px 10px;
            border-bottom: 1px solid #eee;
        }
        td:last-child, th:last-child {
            text-align: right;
        }
        #nutBieuDo {
            margin: 20px 0 12px;
            padding: 8px 16px;
            font-size: 15px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }
        #nutBieuDo:disabled {
            background: #93a7d6;
            cursor: default;
        }
        .dong-bieu-do {
            display: grid;
            grid-template-columns: 100px 1fr;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .vung-thanh {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .ray {
            flex: 1;
        }
        .thanh {
            height: 22px;
            background: #3b82f6;
            border-radius: 4px;
        }
        .gia-tri {
            width: 90px;
            font-size: 13px;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <h1>Máy tính chi tiêu</h1>

    <div class="the-thong-ke">
        <div class="the"><div class="nhan">Tổng</div><div class="so" id="tong"></div></div>
        <div class="the"><div class="nhan">Trung bình</div><div class="so" id="trungBinh"></div></div>
        <div class="the"><div class="nhan">Lớn nhất</div><div class="so" id="max"></div></div>
        <div class="the"><div class="nhan">Nhỏ nhất</div><div class="so" id="min"></div></div>
    </div>

    <table>
        <thead>
            <tr><th>Khoản chi</th><th>Số tiền</th></tr>
        </thead>
        <tbody id="bangChiTieu"></tbody>
    </table>

    <button id="nutBieuDo">Xem biểu đồ</button>
    <div id="khungBieuDo"></div>

    <script type="module" src="main.js"></script>
</body>
</html>
